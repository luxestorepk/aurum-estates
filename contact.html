<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — AURUM ESTATES</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">

<div class="ph"><div class="wrap"><div class="eyebrow">Get In Touch</div><h1>Request a Private Viewing</h1></div></div>

<section><div class="wrap"><div class="cgrid">
<form id="f">
<input id="n" placeholder="Full name" required>
<input id="p" placeholder="Phone / WhatsApp (with country code)" required>
<input id="e" type="email" placeholder="Email" class="full">
<select id="i" class="full"><option>Buy a property</option><option>Sell a property</option><option>Invest</option><option>Rent</option></select>
<textarea id="m" rows="5" class="full" placeholder="Tell us what you are looking for"></textarea>
<button class="btn solid full" type="submit">Send on WhatsApp</button>
<a class="btn full" id="em" href="#">Send by Email</a>
</form>
<div>
<h3 class="serif" style="font-size:34px;margin-bottom:10px">Our Offices</h3>
<div id="off"></div>
<p style="margin-top:22px;color:var(--mut);font-size:13px">Available 7 days a week for video consultations across all time zones.</p>
</div>
</div></div></section>

<script src="app.js"></script>
</body>
</html>
